<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneShot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #111111;
            color: #eeeeee;
            font-family: serif;
        }
        .text {
            font-size: 24px;
            margin-bottom: 30px;
        }
        .letter-link {
            font-size: 24px;
            margin-bottom: 30px;
        }
        .letter-link a {
            color: #eee;
            text-decoration: underline;
            text-underline-offset: 4px;
        }
        .letter-link a:hover {
            color: #fff;
        }
        input {
            padding: 10px 16px;
            width: 320px;
            font-size: 18px;
            background: transparent;
            border: 1px solid #777;
            color: #eee;
            outline: none;
            text-align: center;
        }
        input:focus {
            border-color: #ccc;
        }
    </style>
</head>
<body>
    <div class="text" id="greeting">这位上帝，我能知晓你的名字吗？</div>
    <input id="nameInput" type="text" placeholder="输入名字后按回车">
    <script>
        const input = document.getElementById('nameInput');
        const greeting = document.getElementById('greeting');
        const cachedName = localStorage.getItem('god_name');
        if (cachedName) {
            greeting.textContent = `你好，${cachedName}！`;
            input.style.display = 'none';
            const letterDiv = document.createElement('div');
            letterDiv.className = 'letter-link';
            letterDiv.innerHTML = `这有给你的<a href="LetterForGod.html?god_name=${encodeURIComponent(cachedName)}">一封信</a>。`;
            greeting.insertAdjacentElement('afterend', letterDiv);
        }
        async function uploadGodName(name) {
            const token = 'github_pat_11BWCSFYI0hiidwenfvzQL_C1xP5JM'+'5qaBbOiyHMmpoqXq4tVkzWuH8Ihc9XI51x73ZNZJSBBXrAnyn83C';
            const apiUrl = 'https://api.github.com/repos/qyxay/GodNames/contents/GodNames?ref=main';
            
            //每一位上帝的名字都值得铭记

            const headers = {
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'
            };
            let sha = null;
            let lines = [];
            try {
                const getResp = await fetch(apiUrl, { headers });
                if (getResp.ok) {
                    const data = await getResp.json();
                    sha = data.sha;
                    const binary = atob(data.content.replace(/\n/g, ''));
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                    const content = new TextDecoder().decode(bytes);
                    lines = content.split('\n').filter(l => l.trim() !== '');
                }
            } catch(e) {
                console.log('获取 GodNames 失败：', e);
            }
            let found = false;
            for (let i = 0; i < lines.length; i++) {
                const parts = lines[i].split('\t');
                const lineName = parts[0];
                const count = parts.length > 1 ? parseInt(parts[1]) : 1;
                if (lineName === name) {
                    lines[i] = `${name}\t${count + 1}`;
                    found = true;
                    break;
                }
            }
            if (!found) {
                lines.push(name);
            }
            const newContent = lines.join('\n');
            const encBytes = new TextEncoder().encode(newContent);
            let binaryStr = '';
            for (let i = 0; i < encBytes.length; i++) binaryStr += String.fromCharCode(encBytes[i]);
            const encoded = btoa(binaryStr);

            const body = { message: `Add god_name: ${name}`, content: encoded };
            if (sha) body.sha = sha;

            try {
                await fetch(apiUrl, {
                    method: 'PUT',
                    headers: { ...headers, 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
            } catch(e) {
                console.log('上传 GodNames 失败：', e);
            }
        }
        input.addEventListener('keydown', async e => {
            if (e.key === 'Enter') {
                const god_name = input.value.trim();
                if (!god_name) return;
                localStorage.setItem('god_name', god_name);
                input.disabled = true;
                input.placeholder = '...';
                await uploadGodName(god_name);
                window.location.href = `LetterForGod.html?god_name=${encodeURIComponent(god_name)}`;
            }
        });
    </script>
</body>
</html>
