<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneShot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #111111;
            color: #eeeeee;
            font-family: serif;
            gap: 30px;
        }
        .text {
            font-size: 24px;
            text-align: center;
        }
        .letter-link {
            font-size: 24px;
        }
        .letter-link a {
            color: #eee;
            text-decoration: underline;
            text-underline-offset: 4px;
        }
        .letter-link a:hover {
            color: #fff;
        }
        .input-wrap {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        input {
            padding: 10px 16px;
            width: 320px;
            font-size: 18px;
            background: transparent;
            border: 1px solid #777;
            color: #eee;
            outline: none;
            text-align: center;
        }
        input:focus {
            border-color: #ccc;
        }
        .tip {
            font-size: 14px;
            color: #aaa;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="text" id="greeting">这位上帝，我能知晓你的名字吗？</div>
    <div class="input-wrap">
        <input id="nameInput" type="text" placeholder="输入名字后按回车">
        <div class="tip" id="tip"></div>
    </div>

    <script>
        const OWNER = "qyxay";
        const REPO = "OneShotWeb";
        const input = document.getElementById('nameInput');
        const greeting = document.getElementById('greeting');
        const tipEl = document.getElementById('tip');
        const cachedName = localStorage.getItem('god_name');

        if (cachedName) {
            greeting.textContent = `你好，${cachedName}！`;
            input.style.display = 'none';
            const letterDiv = document.createElement('div');
            letterDiv.className = 'letter-link';
            letterDiv.innerHTML = `这有给你的<a href="LetterForGod.html?god_name=${encodeURIComponent(cachedName)}">一封信</a>。`;
            greeting.insertAdjacentElement('afterend', letterDiv);
        }

        async function createSaveIssue(name) {
            tipEl.textContent = "正在提交记录...";
            try {
                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/issues`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/vnd.github+json"
                    },
                    body: JSON.stringify({
                        title: `存档用户名字：${name}`,
                        body: name
                    })
                });
                if (!res.ok) throw new Error("仓库未开放外部提交Issues");
                tipEl.textContent = "记录提交成功，正在跳转信件...";
                return true;
            } catch (err) {
                console.error(err);
                tipEl.textContent = "提交失败：仓库未允许访客创建Issues";
                return false;
            }
        }

        input.addEventListener('keydown', async e => {
            if (e.key === 'Enter') {
                const god_name = input.value.trim();
                if (!god_name) {
                    tipEl.textContent = "请输入有效名称";
                    return;
                }
                input.disabled = true;
                input.placeholder = "处理中...";
                localStorage.setItem('god_name', god_name);
                await createSaveIssue(god_name);
                window.location.href = `LetterForGod.html?god_name=${encodeURIComponent(god_name)}`;
            }
        });
    </script>
</body>
</html>
