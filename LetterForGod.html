<!DOCTYPE html>
<html lang="zh-CN">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter For God</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #111111;
            color: #eeeeee;
            font-family: serif;
            padding: clamp(24px, 5vw, 40px);
            line-height: 1.8;
        }
        .title {
            font-size: clamp(22px, 4vw, 26px);
            margin-bottom: 32px;
        }
        .content {
            font-size: clamp(16px, 3vw, 20px);
            max-width: min(90%, 100000px);
            white-space: pre-wrap;
        }
        .cursor {
            display: inline-block;
            width: 8px;
            height: 1.2em;
            vertical-align: text-bottom;
            background: #eee;
            margin-left: 2px;
            animation: blink 0.7s infinite;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="title" id="letterTitle"></div>
    <div class="content" id="letterContent"><span class="cursor"></span></div>
    <script>
    
        // 总会有人查看源代码

        const urlParams = new URLSearchParams(window.location.search);
        const god_name = urlParams.get('god_name') || "%……T#^&#";
        
        localStorage.setItem('god_name', god_name);
        document.getElementById('letterTitle').textContent = `致${god_name}:`;

        // 没关系

        const contentEl = document.getElementById("letterContent");

        const typeSfx = new Audio("sfx/text.wav");

        typeSfx.volume = 0.2;


        function xorEncrypt(text, key) {
            const textBytes = new TextEncoder().encode(text);
            const keyBytes = new TextEncoder().encode(key);
            const result = new Uint8Array(textBytes.length);
            for (let i = 0; i < textBytes.length; i++) {
                result[i] = textBytes[i] ^ keyBytes[i % keyBytes.length];
            }
            let binaryStr = '';
            for (let i = 0; i < result.length; i++) {
                binaryStr += String.fromCharCode(result[i]);
            }
            return btoa(binaryStr);
        }
        const code = xorEncrypt('pilgrimage', god_name);

        // 不论你如何知晓它，都没关系。

        const rawText = "　　如果你对游戏的完结感到不舍，|800如果你对旅途的终结感到失落，|800如果你深爱着Niko，|800如果你甚至曾为其而哭泣。\n　　|2000......我也和你一样。\n　　|800 " + code + " ，你会用上它的。";
        
        // 如果你也想重新开启旅途，来吧，来吧，我走在你前头了。

        const seen = localStorage.getItem('letter_seen') === '1';
        localStorage.setItem('letter_seen', '1');
        const baseSpeed = seen ? 15 : 60;

        
        const tokens = [];
        let ptr = 0;
        while(ptr < rawText.length){
            if(rawText[ptr] === '|'){
                ptr++;
                let numStr = '';
                while(ptr < rawText.length && /\d/.test(rawText[ptr])){
                    numStr += rawText[ptr];
                    ptr++;
                }
                tokens.push({type:"pause", ms: Number(numStr)});
            }else{
                tokens.push({type:"char", char: rawText[ptr]});
                ptr++;
            }
        }

        let tokenIndex = 0;
        let charCount = 0;
        function runType(){
            if(tokenIndex >= tokens.length){
                contentEl.querySelector(".cursor")?.remove();
                return;
            }
            const tok = tokens[tokenIndex];
            tokenIndex++;
            if(tok.type === "char"){
                
                const cursor = contentEl.querySelector(".cursor");
                contentEl.insertBefore(document.createTextNode(tok.char), cursor);
                charCount++;
                
                if (!seen || charCount % 4 === 0) {
                    typeSfx.currentTime = 0;
                    typeSfx.play().catch(e=>{
                        console.log("music error：",e);
                    });
                }
                setTimeout(runType, baseSpeed);
            }else if(tok.type === "pause"){
                
                setTimeout(runType, seen ? Math.min(tok.ms, 80) : tok.ms);
            }
        }

        
        runType();
    </script>
</body>
</html>
